apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: task-api

  template:
    metadata:
      labels:
        app: task-api
    spec:
      containers:
        - name: task-api
          image: task-management:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080